<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Team | Travel to the Future</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: Vazir, sans-serif; background-color: #0a0c10; color: white; overflow-x: hidden; margin: 0; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0c10; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; box-shadow: 0 0 10px #3b82f6; }

        /* Background Canvas */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.4; }

        /* Splash Screen */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: all 2s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: top right; overflow: hidden; }
        #splash-screen.shrink-to-corner { transform: translate(42vw, -42vh) scale(0.12); opacity: 0; background-color: transparent; pointer-events: none; }
        #center-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #main-splash-logo { position: relative; width: 150px; height: 150px; object-fit: contain; z-index: 2; opacity: 0; transform: scale(0.6); filter: drop-shadow(0 0 25px rgba(59,130,246,0.9)); transition: opacity 2s ease, transform 2s ease; }
        @media (min-width: 768px) { #main-splash-logo { width: 260px; height: 260px; filter: drop-shadow(0 0 40px rgba(59,130,246,0.9)); } }
        #main-splash-logo.show { opacity: 1; transform: scale(1); }

        /* Main Content */
        #main-content { position: relative; z-index: 10; opacity: 0; visibility: hidden; transition: opacity 1.5s ease, visibility 1.5s; }
        #main-content.show { opacity: 1; visibility: visible; }

        /* Animations */
        .neon-text { text-shadow: 0 0 15px rgba(59,130,246,0.7); }
        .neon-border { border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); transition: all 0.3s ease; }
        .neon-border:hover { border-color: #3b82f6; box-shadow: 0 0 25px rgba(59, 130, 246, 0.6); transform: translateY(-5px); }
        .pulse-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .floating { animation: float 4s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        
        .cursor-blink::after { content: '|'; animation: blink 1s infinite; color: #3b82f6; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Header Glow */
        .header-glow::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #3b82f6, transparent); opacity: 0.5; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 12, 16, 0.9); backdrop-filter: blur(5px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content { background: #1e2329; border: 1px solid #3b82f6; box-shadow: 0 0 30px rgba(59,130,246,0.3); width: 92%; max-width: 600px; border-radius: 1rem; padding: 2rem; transform: scale(0.9); transition: transform 0.3s ease; max-height: 90vh; overflow-y: auto; }
        .modal.active .modal-content { transform: scale(1); }
    </style>
</head>

        // ================= MATRIX CLOCK (NIXIE) =================
        const clockCanvas = document.getElementById('clock-canvas');
        const clockCtx = clockCanvas.getContext('2d');
        
        const digitMatrix = {
            '0': ["01110", "10001", "10001", "10001", "01110"],
            '1': ["00100", "01100", "00100", "00100", "01110"],
            '2': ["01110", "10001", "00110", "01000", "11111"],
            '3': ["01110", "10001", "00110", "10001", "01110"],
            '4': ["00010", "00110", "01010", "11111", "00010"],
            '5': ["11111", "10000", "11110", "00001", "11110"],
            '6': ["01110", "10000", "11110", "10001", "01110"],
            '7': ["11111", "00001", "00010", "00100", "01000"],
            '8': ["01110", "10001", "01110", "10001", "01110"],
            '9': ["01110", "10001", "01111", "00001", "01110"],
            ':': ["00000", "00100", "00000", "00100", "00000"]
        };

        let clockParticles = [];
        let lastTimeStr = "";
        
        function initClock() {
            clockParticles = [];
            for (let i = 0; i < 8; i++) { 
                clockParticles.push({ dots: [] });
            }
        }

        function drawClockTube(x, y, w, h) {
            clockCtx.fillStyle = 'rgba(10, 12, 16, 0.8)';
            clockCtx.strokeStyle = '#3b82f6';
            clockCtx.lineWidth = 1;
            clockCtx.beginPath();
            clockCtx.roundRect(x, y, w, h, 5);
            clockCtx.fill();
            clockCtx.stroke();
            
            clockCtx.fillStyle = 'rgba(59, 130, 246, 0.05)';
            clockCtx.beginPath();
            clockCtx.roundRect(x+1, y+1, w-2, h-2, 4);
            clockCtx.fill();
        }

        function updateClockAnim() {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
            
            if (timeStr !== lastTimeStr) {
                for (let i = 0; i < 8; i++) {
                    const char = timeStr[i];
                    const pattern = digitMatrix[char];
                    
                    clockParticles[i].dots.forEach(dot => {
                        dot.vy = Math.random() * 2 + 1; 
                    });
                    
                    const newDots = [];
                    for (let r = 0; r < 5; r++) {
                        for (let c = 0; c < 5; c++) {
                            if (pattern[r][c] === '1') {
                                newDots.push({
                                    targetX: c * 3, 
                                    targetY: r * 6,
                                    x: c * 3,
                                    y: -20 - Math.random() * 20,
                                    vy: 2 + Math.random() * 2
                                });
                            }
                        }
                    }
                    clockParticles[i].dots = clockParticles[i].dots.concat(newDots);
                }
                lastTimeStr = timeStr;
            }

            clockCtx.clearRect(0, 0, clockCanvas.width, clockCanvas.height);
            
            const tubeW = 16;
            const tubeH = 28;
            const gap = 4;
            let startX = 5;
            const startY = 4;

            for(let i=0; i<6; i++) {
                drawClockTube(startX + i * (tubeW + gap), startY, tubeW, tubeH);
            }
            drawClockTube(startX + 2 * (tubeW + gap) - 2, startY + 6, 4, 16);
            drawClockTube(startX + 5 * (tubeW + gap) - 2, startY + 6, 4, 16);

            clockCtx.fillStyle = '#60a5fa';
            clockCtx.shadowBlur = 4;
            clockCtx.shadowColor = '#3b82f6';

            for (let i = 0; i < 8; i++) {
                let offsetX = startX + i * (tubeW + gap) + 2;
                let offsetY = startY + 4;
                
                if (i === 2 || i === 5) {
                    offsetX = startX + i * (tubeW + gap) + 1;
                    offsetY = startY + 8;
                }

                const tubeDots = clockParticles[i].dots;
                for (let j = tubeDots.length - 1; j >= 0; j--) {
                    const dot = tubeDots[j];
                    
                    if (dot.y < dot.targetY) {
                        dot.y += dot.vy;
                        if (dot.y > dot.targetY) dot.y = dot.targetY;
                    } else if (dot.vy > 0) { 
                        dot.y += dot.vy;
                        if (dot.y > tubeH) {
                            tubeDots.splice(j, 1);
                            continue;
                        }
                    }

                    clockCtx.beginPath();
                    clockCtx.arc(offsetX + dot.x, offsetY + dot.y, 1, 0, Math.PI * 2);
                    clockCtx.fill();
                }
            }
            requestAnimationFrame(updateClockAnim);
        }
        
        initClock();
        updateClockAnim();

        // ================= TYPEWRITER =================
        let typewriterTimeout;
        function startTypewriter(lang) {
            clearTimeout(typewriterTimeout);
            const titleElement = document.getElementById('hero-title');
            const t1 = translations[lang].hero_title_1;
            const t2 = translations[lang].hero_title_2;
            
            titleElement.innerHTML = `<span id="typewriter-part1"></span> <span class="text-blue-500 neon-text">SK Team</span> <br /> <span id="typewriter-part2"></span>`;
            
            const part1 = document.getElementById('typewriter-part1');
            const part2 = document.getElementById('typewriter-part2');
            let i = 0, j = 0;
            
            function type() {
                if (i < t1.length) {
                    part1.textContent += t1.charAt(i);
                    i++;
                    typewriterTimeout = setTimeout(type, 80);
                } else if (j < t2.length) {
                    part2.textContent += t2.charAt(j);
                    j++;
                    typewriterTimeout = setTimeout(type, 80);
                }
            }
            type();
        }

                document.querySelectorAll('[data-i18n]').forEach(el => {

                        el.innerHTML = translations[lang][key];
                    }

                renderBots(lang);

        // ================= BACKGROUND MATRIX =================
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        const bgLetters = '01';
        const bgFontSize = 16;
        const bgColumns = bgCanvas.width / bgFontSize;
        const bgDrops = [];
        for (let x = 0; x < bgColumns; x++) { bgDrops[x] = { y: Math.random() * -100, speed: Math.random() * 0.2 + 0.1 }; }
        function drawBgMatrix() {
            bgCtx.fillStyle = 'rgba(10, 12, 16, 0.15)'; 
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = '#3b82f6';
            bgCtx.font = bgFontSize + 'px monospace';
            for (let i = 0; i < bgDrops.length; i++) {
                const text = bgLetters.charAt(Math.floor(Math.random() * bgLetters.length));
                bgCtx.fillText(text, i * bgFontSize, bgDrops[i].y * bgFontSize);
                bgDrops[i].y += bgDrops[i].speed;
                if (bgDrops[i].y * bgFontSize > bgCanvas.height && Math.random() > 0.98) {
                    bgDrops[i].y = 0;
                    bgDrops[i].speed = Math.random() * 0.2 + 0.1; 
                }
            }
        }
        setInterval(drawBgMatrix, 50);

        // ================= SPLASH SCREEN =================
        const centerCanvas = document.getElementById('center-canvas');
        const centerCtx = centerCanvas.getContext('2d');
        centerCanvas.width = window.innerWidth;
        centerCanvas.height = window.innerHeight;
        
        const isMobile = window.innerWidth < 768;
        let centerParticles = [];
        const centerX = centerCanvas.width / 2;
        const centerY = centerCanvas.height / 2;
        const targetRadius = isMobile ? 85 : 160; 
        const step = isMobile ? 12 : 15; 
        let rawTargets = [];

        for (let y = -targetRadius; y <= targetRadius; y += step) {
            for (let x = -targetRadius; x <= targetRadius; x += step) {
                if (x*x + y*y <= targetRadius*targetRadius) {
                    rawTargets.push({ x: centerX + x, y: centerY + y });
                }
            }
        }

        rawTargets.sort((a, b) => b.y - a.y); 
        const totalFillTime = 2500; 
        rawTargets.forEach((target, index) => {
            const delay = (index / rawTargets.length) * totalFillTime;
            centerParticles.push({
                x: target.x,
                targetY: target.y,
                y: -50, 
                speed: Math.random() * 2 + 4, 
                char: bgLetters.charAt(Math.floor(Math.random() * bgLetters.length)),
                startTime: delay,
                isSettled: false
            });
        });

        let startTime = performance.now();
        function animateCenter(currentTime) {
            if (!startTime) startTime = currentTime;
            const elapsedTime = currentTime - startTime;
            centerCtx.clearRect(0, 0, centerCanvas.width, centerCanvas.height);
            centerCtx.shadowBlur = 0; 
            centerCtx.fillStyle = '#60a5fa'; 
            centerCtx.font = (isMobile ? '11px' : '14px') + ' monospace'; 
            centerCtx.textAlign = 'center';
            centerCtx.textBaseline = 'middle';

            centerParticles.forEach(p => {
                if (elapsedTime > p.startTime) {
                    if (!p.isSettled) {
                        p.y += p.speed;
                        if (p.y >= p.targetY) {
                            p.y = p.targetY;
                            p.isSettled = true; 
                        }
                    }
                    centerCtx.fillText(p.char, p.x, p.y);
                }
            });
            requestAnimationFrame(animateCenter);
        }
        requestAnimationFrame(animateCenter);

            setTimeout(() => { mainLogo.classList.add('show'); }, 3000);
            setTimeout(() => {
                splashScreen.classList.add('shrink-to-corner');

                setTimeout(() => { splashScreen.style.display = 'none'; }, 2000);
            }, 7000); 
        });

        // ================= RENDER BOTS =================
        const baseBotsData = {
            'music-player': 'robot_headphones_transparent.png',

        function renderBots(lang) {
            const grid = document.getElementById('bots-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            for (const [id, img] of Object.entries(baseBotsData)) {

                const card = document.createElement('div');
                card.className = 'bot-card bg-[#1e2329] border border-gray-700 rounded-2xl p-6 flex flex-col justify-between cursor-pointer neon-border group relative overflow-hidden';
                card.onclick = () => openBotDetail(id, lang);
                card.innerHTML = `
                    <div>
                        <div class="w-full h-48 relative mb-6 flex justify-center items-center bg-[#0a0c10] rounded-xl overflow-hidden border border-gray-800 group-hover:scale-105 transition-transform duration-300">
                            <img src="${img}" alt="${bot.title}" class="w-40 h-40 object-contain drop-shadow-[0_0_15px_rgba(59,130,246,0.3)]" />
                        </div>
                        <h3 class="text-xl md:text-2xl font-bold mb-3 text-white text-center md:text-right">${bot.title}</h3>
                        <p class="text-gray-400 text-sm mb-6 leading-relaxed text-center md:text-right">${bot.shortDesc}</p>
                    </div>
                    <div class="flex items-center justify-center mt-4 pt-4 border-t border-gray-700">
                        <span class="text-blue-400 font-bold group-hover:text-blue-300 flex items-center gap-2 transition-colors text-sm md:text-base">
                            ${translations[lang].btn_view_bots}
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function openBotDetail(botId, lang) {
            const bot = translations[lang].bots[botId];
            const img = baseBotsData[botId];
            if(!bot) return;

            document.getElementById('home-view').classList.add('hide');
            const detailView = document.getElementById('bot-detail-view');
            detailView.classList.remove('hide');

            document.getElementById('detail-title').innerText = bot.title;
            document.getElementById('detail-image').src = img;
            document.getElementById('detail-desc').innerText = bot.shortDesc;
            
            const featuresContainer = document.getElementById('detail-features');
            featuresContainer.innerHTML = '';
            bot.features.forEach(feature => {
                const div = document.createElement('div');
                div.className = 'bg-[#0a0c10] p-4 rounded-xl border border-gray-800';
                div.innerHTML = feature;
                featuresContainer.appendChild(div);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showHome() {
            document.getElementById('bot-detail-view').classList.add('hide');
            document.getElementById('home-view').classList.remove('hide');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Modals
        function openServiceModal(serviceId) {
            const lang = localStorage.getItem('skteam_lang') || 'fa';
            const data = translations[lang][`srv_${serviceId}_title`] ? {
                title: translations[lang][`srv_${serviceId}_title`],
                body: `<p>${translations[lang][`srv_${serviceId}_desc`]}</p>`
            } : null;
            
            if(!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-body').innerHTML = data.body;
            document.getElementById('service-modal').classList.add('active');
        }

        function closeServiceModal() { document.getElementById('service-modal').classList.remove('active'); }
        function openQRModal() { document.getElementById('qr-modal').classList.add('active'); }
        function closeQRModal() { document.getElementById('qr-modal').classList.remove('active'); }
    </script>

    <!-- Knocket Chat Widget -->
    <script src="https://trtc.io/knocket-sdk/sdk.js?identifier=f672fb450563b86d8&y=17924411579157" async></script>
</body>
</html>
